# 站点基础配置
title: "AmanoHInaC 的个人博客"
author: "AmanoHInaC"
name: "YangCaihina"
email: "2215577371@qq.com"
description: >-
  记录技术、生活与思考的个人博客站点。
url: "https://amanohinac.github.io"
baseurl: "" # 若仓库名为 <username>.github.io 则为空

# 语言与时区
lang: "zh-CN"
timezone: "Asia/Shanghai"

# 作者信息
github_username: "AmanoHInaC"
# 头像用 GitHub 头像，避免本地文件缺失
avatar: "https://github.com/amanohinac.png"

# 构建配置
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor

# 分页由 GitHub Pages 通过 jekyll-paginate 提供
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap