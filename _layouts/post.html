---
layout: default
---
<article class="post-article">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <span>📅 {{ page.date | date: "%Y-%m-%d" }}</span>
    {% if page.tags %}
    <span>🏷️ {{ page.tags | join: ' / ' }}</span>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>
